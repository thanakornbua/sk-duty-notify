<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="page page--narrow">
  <h1 class="h1" data-i18n="account.title"></h1>
  <div id="intro" class="stack" style="margin-bottom:1.5rem"></div>
  <form id="form" class="stack" novalidate></form>
</main>
<script type="module">
import { api, button, el, notification, shell, textInput } from "/admin-common.js";
import { errText, t } from "/i18n.js";

const user = await shell("/account");
document.title = t("account.title");
const first = user.mustChange;
document.getElementById("intro").append(
  el("p", { class: "body secondary" }, t("account.signedInAs", { name: user.displayName, username: user.username })),
  first ? notification("info", t("account.first.title"), t("account.first.body")) : "");

const opts = await fetch("/admin/api/login-options").then((r) => r.json()).catch(() => ({ password: false }));
const form = document.getElementById("form");
if (!opts.password && !first) form.replaceWith(el("p", { class: "body" }, t("account.google", { username: user.username })));
const msg = el("div");
const cur = textInput({ id: "current", label: t(first ? "account.temporary" : "account.current"), type: "password", autocomplete: "current-password" });
const nw = textInput({ id: "next", label: t("account.new"), type: "password", autocomplete: "new-password", helper: t("account.newHelp", { min: 12 }) });
const again = textInput({ id: "again", label: t("account.again"), type: "password", autocomplete: "new-password" });
const go = button(t("account.submit"), { type: "submit" });
form.append(msg, cur, nw, again, go);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  again.invalid(again.input.value === nw.input.value ? null : t("account.mismatch"));
  if (again.input.value !== nw.input.value) return;
  go.disabled = true;
  const { ok, data } = await api("POST", "/admin/api/password", { current: cur.input.value, next: nw.input.value });
  go.disabled = false;
  if (!ok) { msg.replaceChildren(notification("error", t("account.failed"), errText(data))); return; }
  form.reset();
  msg.replaceChildren(notification("success", t("account.changed.title"), t("account.changed.body")));
  if (first) setTimeout(() => location.replace("/dashboard"), 1200);
});
</script>
</body>
</html>
