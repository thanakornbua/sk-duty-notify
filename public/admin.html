<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<script src="/vendor/xlsx.full.min.js"></script>
</head>
<body>
<main class="page">
  <h1 class="h1" data-i18n="members.title"></h1>
  <p class="body secondary" style="max-width:48rem"><span data-i18n="members.intro"></span> <a class="cds--link" href="/sheet" data-i18n="members.toSheet"></a></p>

  <h2 class="h2" data-i18n="members.addTitle"></h2>
  <div id="memberForm" class="cds--tile stack"></div>
  <div id="members" style="margin-top:1rem"></div>

  <h2 class="h2" data-i18n="members.bulk"></h2>
  <div class="cds--tile stack">
    <p class="body secondary"><span data-i18n="members.bulkIntro"></span> <a class="cds--link" href="/members-template.csv" data-i18n="members.bulkTemplate"></a></p>
    <div class="row">
      <label class="cds--btn cds--btn--tertiary" for="memberFile" data-i18n="members.chooseFile"></label>
      <input type="file" id="memberFile" accept=".csv,.xlsx,.xls" hidden>
      <span class="grow"></span>
      <a class="cds--btn cds--btn--ghost" href="/flyer" data-i18n="members.flyer"></a>
    </div>
    <div id="memberImportOut"></div>
  </div>

</main>
<script type="module">
import { api, button, dataTable, el, notification, shell, tag, textInput } from "/admin-common.js";
import { errText, t } from "/i18n.js";

await shell("/admin");
document.title = t("members.title");
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------- members */
const CODE = /^[A-Za-z0-9._-]{1,32}$/;
const code = textInput({ id: "code", label: t("members.code"), helper: t("members.codeHelp"), autocapitalize: "none", spellcheck: "false" });
const name = textInput({ id: "name", label: t("members.name") });
const email = textInput({ id: "email", label: t("members.email"), type: "email", helper: t("members.emailHelp"), autocapitalize: "none", spellcheck: "false" });
const group = textInput({ id: "group", label: t("members.group") });
const memberMsg = el("div");
$("memberForm").append(memberMsg, el("div", { class: "row row--fields" }, code, name, email, group, button(t("members.save"), { size: "md", onclick: saveMember })));

async function saveMember() {
  const staffCode = code.input.value.trim(), label = name.input.value.trim();
  code.invalid(CODE.test(staffCode) ? null : t("members.needCode"));
  name.invalid(label ? null : t("members.needName"));
  if (!CODE.test(staffCode) || !label) return;
  const r = await api("POST", "/admin/api/members", { members: [{ staffCode, label, email: email.input.value.trim() || undefined, group: group.input.value.trim() || undefined }] });
  memberMsg.replaceChildren(r.ok ? notification("success", t("members.saved"), `${staffCode} · ${label}`) : notification("error", t("members.notSaved"), errText(r.data)));
  if (r.ok) { code.input.value = name.input.value = email.input.value = group.input.value = ""; loadMembers(); }
}

/* Bulk member import: header row with staff_code, name, email, group (any order, case-insensitive). */
$("memberFile").addEventListener("change", async () => {
  const f = $("memberFile").files[0];
  const out = $("memberImportOut");
  out.replaceChildren();
  if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer(), { type: "array", raw: /\.csv$/i.test(f.name) });
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
  const head = (aoa[0] ?? []).map((h) => String(h).trim().toLowerCase());
  const col = (n) => head.indexOf(n);
  if (col("staff_code") < 0 || col("name") < 0 || col("email") < 0) { out.append(notification("error", t("members.bulkFailed"), t("members.bulkBadFile"))); return; }
  const members = aoa.slice(1).filter((r) => r.some((c) => String(c).trim())).map((r) => ({
    staffCode: String(r[col("staff_code")]).trim(), label: String(r[col("name")]).trim(),
    email: String(r[col("email")]).trim() || undefined, group: col("group") >= 0 ? String(r[col("group")]).trim() || undefined : undefined,
  }));
  const r = await api("POST", "/admin/api/members", { members });
  out.append(r.ok ? notification("success", t("members.bulkDone", { n: r.data.count })) : notification("error", t("members.bulkFailed"), errText(r.data)));
  $("memberFile").value = "";
  if (r.ok) loadMembers();
});

async function loadMembers() {
  const { ok, data } = await api("GET", "/admin/api/members");
  if (!ok) return;
  $("members").replaceChildren(dataTable({
    title: t("members.members"), description: t("members.count", { n: data.members.length }),
    columns: [t("col.staffCode"), t("col.name"), t("col.email"), t("col.group"), t("col.line"), t("col.consent")],
    rows: data.members.map((m) => [
      el("span", { class: "mono" }, m.staff_code), m.label, m.email ? el("span", { class: "mono" }, m.email) : el("span", { class: "helper" }, "—"), m.grp ?? "",
      m.linked ? tag(t("members.linked"), "green") : tag(t("members.notLinked"), "warm-gray"),
      m.consent_at ? tag(t("members.consentGiven"), "green") : tag(t("members.consentNot"), "gray"),
    ]),
    empty: t("members.none"),
  }));
}

loadMembers();
</script>
</body>
</html>
