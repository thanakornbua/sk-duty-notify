<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
</head>
<body>
<main class="page">
  <h1 class="h1" data-i18n="loc.title"></h1>
  <div class="row row--fields" id="pickRow"></div>
  <div class="cds--tile stack" style="margin-top:1rem">
    <div class="row row--fields" id="fields"></div>
    <p class="helper" data-i18n="loc.help"></p>
    <div id="map"></div>
    <div id="points"></div>
    <div id="msg"></div>
    <div class="row"><span class="grow"></span><span id="saveSlot"></span></div>
  </div>
</main>
<script type="module">
import { api, button, dataTable, el, notification, select, shell, textInput } from "/admin-common.js";
import { errText, t } from "/i18n.js";

await shell("/locations");
document.title = t("loc.title");
const $ = (id) => document.getElementById(id);
const map = L.map("map").setView([13.75, 100.5], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);

let data = { locations: [], defaults: { radiusM: 100, allowedAccuracyM: 50 } };
let points = [], layers = [], editing = null;

const code = textInput({ id: "code", label: t("loc.code"), helper: t("loc.codeHelp"), autocapitalize: "none", spellcheck: "false" });
const name = textInput({ id: "name", label: t("loc.name") });
const acc = textInput({ id: "acc", label: t("loc.accuracy"), type: "number", min: 5, max: 500, helper: t("loc.accuracyHelp") });
$("fields").append(code, name, acc);
$("saveSlot").append(button(t("loc.save"), { onclick: save }));

function draw() {
  layers.forEach((l) => l.remove());
  layers = [];
  for (const p of points) {
    const m = L.marker([p.lat, p.lng], { draggable: true }).addTo(map);
    const c = L.circle([p.lat, p.lng], { radius: p.radiusM, color: "#0f62fe", weight: 2 }).addTo(map);
    m.on("drag", (e) => c.setLatLng(e.latlng));
    m.on("dragend", (e) => { const ll = e.target.getLatLng(); p.lat = +ll.lat.toFixed(6); p.lng = +ll.lng.toFixed(6); table(); });
    layers.push(m, c);
  }
  table();
}

function table() {
  const num = (p, k, attrs = {}) => el("input", { class: "cds--text-input", type: "number", step: "any", value: p[k], style: "min-width:7rem",
    onchange: (e) => { p[k] = Number(e.target.value); draw(); }, ...attrs });
  $("points").replaceChildren(dataTable({
    title: t("loc.points"), columns: [t("col.label"), t("col.lat"), t("col.lng"), t("col.radius"), ""],
    rows: points.map((p, i) => [
      el("input", { class: "cds--text-input", value: p.label ?? "", placeholder: t("loc.labelPlaceholder"), onchange: (e) => { p.label = e.target.value; } }),
      num(p, "lat"), num(p, "lng"), num(p, "radiusM", { min: 10, max: 2000 }),
      button(t("act.remove"), { kind: "danger--ghost", size: "sm", onclick: () => { points.splice(i, 1); draw(); } }),
    ]),
    empty: t("loc.noPoints"),
  }));
}

function edit(loc) {
  editing = loc ?? null;
  code.input.value = loc?.code ?? "";
  code.input.disabled = !!loc;
  name.input.value = loc?.name ?? "";
  acc.input.value = loc?.allowed_accuracy_m ?? data.defaults.allowedAccuracyM;
  points = (loc?.points ?? []).map((p) => ({ label: p.label, lat: p.lat, lng: p.lng, radiusM: p.radius_m }));
  $("msg").replaceChildren();
  draw();
  if (points.length) map.fitBounds(L.featureGroup(layers).getBounds().pad(0.4));
}

async function load(selectCode) {
  const r = await api("GET", "/admin/api/locations");
  if (!r.ok) return;
  data = r.data;
  const pick = select({ id: "pick", label: t("loc.location"), value: selectCode ?? "",
    options: [["", t(data.locations.length ? "loc.choose" : "loc.noneYet")], ...data.locations.map((l) => [l.code, `${l.code} · ${l.name}`])] });
  pick.input.addEventListener("change", (e) => edit(data.locations.find((l) => l.code === e.target.value)));
  $("pickRow").replaceChildren(pick, button(t("loc.new"), { kind: "tertiary", size: "md", onclick: () => { pick.input.value = ""; edit(null); } }));
  edit(data.locations.find((l) => l.code === selectCode));
}

map.on("click", (e) => { points.push({ lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6), radiusM: data.defaults.radiusM }); draw(); });

async function save() {
  const c = code.input.value.trim();
  code.invalid(/^[A-Za-z0-9._-]{1,32}$/.test(c) ? null : t("members.needCode"));
  name.invalid(name.input.value.trim() ? null : t("members.needName"));
  if (!/^[A-Za-z0-9._-]{1,32}$/.test(c) || !name.input.value.trim()) return;
  if (!points.length) { $("msg").replaceChildren(notification("error", t("loc.needPoint.title"), t("loc.needPoint.body"))); return; }
  const r = await api("POST", "/admin/api/locations", { code: c, name: name.input.value.trim(), allowedAccuracyM: Number(acc.input.value), points });
  $("msg").replaceChildren(r.ok ? notification("success", t("loc.saved"), t("loc.savedBody", { code: c, n: points.length })) : notification("error", t("loc.notSaved"), errText(r.data)));
  if (r.ok) load(c);
}

load();
</script>
</body>
</html>
