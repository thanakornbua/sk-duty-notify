<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="page" style="max-width:56rem">
  <h1 class="h1" data-i18n="set.title"></h1>
  <p class="body secondary" data-i18n="set.intro"></p>
  <p class="helper" id="last" style="margin-top:.5rem"></p>
  <div id="msg" style="margin-top:1rem"></div>
  <form id="form" novalidate></form>
</main>
<script type="module">
import { api, button, el, notification, select, shell, textInput } from "/admin-common.js";
import { dateTime, errText, t } from "/i18n.js";

await shell("/settings");
document.title = t("set.title");
const $ = (id) => document.getElementById(id);
const { data } = await api("GET", "/admin/api/settings");
if (data.updatedAt) $("last").textContent = t("set.lastChange", { time: dateTime(data.updatedAt), by: data.updatedBy.replace(/^admin:/, "") });

// 24-hour HH:MM as plain text: the browser's own time picker may show 12-hour "PM", which clashes with shift names.
const time = (id, label, value, helper) => textInput({ id, label, value, helper: helper ?? t("set.timeHelp"), inputmode: "numeric", maxlength: 5, placeholder: "HH:MM", autocomplete: "off" });
const num = (id, label, value, helper, min, max) => textInput({ id, label, type: "number", value, helper, min, max });
const f = {};
let shiftRows = []; // the shift editor's rows (built in build())
const liveShifts = () => shiftRows.filter((r) => !r.removed);
function build(s) {
  for (const k of Object.keys(f)) delete f[k];
  // Shift list editor: code (used in roster files), optional display name, start, end. Order = duty sheet columns.
  const list = Array.isArray(s.shifts) ? s.shifts : Object.entries(s.shifts).map(([code, x]) => ({ code, name: "", ...x }));
  shiftRows = [];
  const shiftBox = el("div", { class: "stack" });
  const addRow = (sh = { code: "", name: "", start: "", end: "" }) => {
    const i = shiftRows.length;
    const row = {
      code: textInput({ id: `sh-code-${i}`, label: t("set.shiftCode"), value: sh.code, helper: t("set.shiftCodeHelp"), maxlength: 12, autocapitalize: "characters", spellcheck: "false" }),
      name: textInput({ id: `sh-name-${i}`, label: t("set.shiftName"), value: sh.name ?? "", helper: t("set.shiftNameHelp"), maxlength: 40 }),
      start: time(`sh-start-${i}`, t("set.shiftStartT"), sh.start),
      end: time(`sh-end-${i}`, t("set.shiftEndT"), sh.end),
    };
    row.box = el("div", { class: "row row--fields shift-row" }, row.code, row.name, row.start, row.end,
      button(t("set.shiftRemove"), { kind: "ghost", size: "md", onclick: () => {
        if (shiftRows.filter((r) => !r.removed).length <= 1) return;
        row.removed = true; row.box.remove(); addBtn.disabled = false;
      } }));
    shiftRows.push(row);
    shiftBox.append(row.box);
    addBtn.disabled = shiftRows.filter((r) => !r.removed).length >= 8;
  };
  const addBtn = button(t("set.shiftAdd"), { kind: "tertiary", size: "md", onclick: () => addRow() });
  list.forEach((sh) => addRow(sh));
  f.shiftsBox = el("div", { class: "stack" }, el("p", { class: "body secondary" }, t("set.shiftsIntro")), shiftBox, el("div", {}, addBtn));
  f.reminderTime = time("reminder", t("set.reminderTime"), s.reminderTime, t("set.reminderHelp"));
  f.missedAfterMinutes = num("missed", t("set.missedAfter"), s.missedAfterMinutes, t("set.missedHelp"), 5, 240);
  f.messageLanguage = select({ id: "lang", label: t("set.language"), value: s.messageLanguage, options: [["th", t("set.lang.th")], ["en", t("set.lang.en")]] });
  const confirm = el("input", { type: "checkbox", class: "cds--checkbox", id: "confirm", checked: s.confirmOnCheckin });
  f.confirmOnCheckin = el("div", { class: "cds--form-item cds--checkbox-wrapper" }, confirm,
    el("label", { class: "cds--checkbox-label", for: "confirm" }, el("span", { class: "cds--checkbox-label-text" }, t("set.confirm"))),
    el("div", { class: "cds--form__helper-text" }, t("set.confirmHelp")));
  f.confirmOnCheckin.input = confirm;
  f["quietHours.start"] = time("q-start", t("set.quietStart"), s.quietHours.start);
  f["quietHours.end"] = time("q-end", t("set.quietEnd"), s.quietHours.end);
  f.emailMode = select({ id: "emailMode", label: t("set.emailMode"), value: s.emailMode ?? "off",
    options: [["off", t("set.email.off")], ["fallback", t("set.email.fallback")], ["all", t("set.email.all")]] });
  const emailStatus = data.emailConfigured
    ? notification("success", t("set.email.ready"))
    : notification("warning", t("set.email.notConfigured.t"), t("set.email.notConfigured.b"));
  const testOut = el("div");
  const testBtn = button(t("set.email.test"), { kind: "tertiary", size: "md", disabled: !data.emailConfigured, onclick: async () => {
    testBtn.disabled = true;
    const r = await api("POST", "/admin/api/email/test");
    testBtn.disabled = false;
    testOut.replaceChildren(r.ok ? notification("success", t("set.email.testSent", { to: r.data.to }))
      : notification("error", t("set.email.testFailed"), r.data.detail ?? errText(r.data)));
  } });
  f.earlyGraceMinutes = num("early", t("set.early"), s.earlyGraceMinutes, t("set.earlyHelp"), 0, 120);
  f.lateAfterMinutes = num("late", t("set.lateAfter"), s.lateAfterMinutes, t("set.lateHelp"), 0, 240);

  const section = (title, ...rows) => el("div", { class: "cds--tile stack", style: "margin-top:1rem" }, el("h2", { class: "h3" }, title), ...rows);
  $("form").replaceChildren(
    section(t("set.shifts"), f.shiftsBox),
    section(t("set.window"), el("div", { class: "row row--fields" }, f.earlyGraceMinutes, f.lateAfterMinutes)),
    section(t("set.messages"), el("div", { class: "row row--fields" }, f.reminderTime, f.missedAfterMinutes), el("div", { class: "row row--fields" }, f.messageLanguage), f.confirmOnCheckin),
    section(t("set.quiet"), el("div", { class: "row row--fields" }, f["quietHours.start"], f["quietHours.end"])),
    section(t("set.email"), el("p", { class: "body secondary" }, t("set.emailIntro")), emailStatus,
      el("div", { class: "row row--fields" }, f.emailMode, testBtn), testOut),
    el("div", { class: "row", style: "margin-top:1.5rem" }, el("span", { class: "grow" }),
      button(t("set.defaults"), { kind: "ghost", onclick: () => build(data.defaults) }), button(t("act.save"), { type: "submit" })));
}
build(data.schedule);

const v = (k) => f[k].input.value;
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  for (const w of Object.values(f)) w.invalid?.(null);
  for (const r of liveShifts()) for (const k of ["code", "name", "start", "end"]) r[k].invalid(null);
  const body = {
    shifts: liveShifts().map((r) => ({ code: r.code.input.value.trim().toUpperCase(), name: r.name.input.value.trim(), start: r.start.input.value.trim(), end: r.end.input.value.trim() })),
    reminderTime: v("reminderTime"), missedAfterMinutes: Number(v("missedAfterMinutes")), messageLanguage: v("messageLanguage"),
    confirmOnCheckin: f.confirmOnCheckin.input.checked, quietHours: { start: v("quietHours.start"), end: v("quietHours.end") },
    earlyGraceMinutes: Number(v("earlyGraceMinutes")), lateAfterMinutes: Number(v("lateAfterMinutes")),
    emailMode: v("emailMode"),
  };
  const r = await api("POST", "/admin/api/settings", body);
  if (r.ok) {
    $("msg").replaceChildren(notification("success", t("set.saved"), r.data.replanned ? t("set.savedBody", { n: r.data.replanned }) : ""));
  } else {
    const msg = t(`set.field.${r.data.error}`);
    // "shifts.<i>.<part>" marks that shift input; "quietHours" marks its end input; others mark themselves.
    const m = /^shifts\.(\d+)\.(\w+)$/.exec(r.data.field ?? "");
    const target = m ? liveShifts()[Number(m[1])]?.[m[2]] : f[r.data.field] ?? f[`${r.data.field}.end`];
    target?.invalid?.(msg);
    $("msg").replaceChildren(notification("error", t("set.notSaved"), msg));
  }
  scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
