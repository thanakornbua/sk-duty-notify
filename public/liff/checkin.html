<!doctype html>
<html lang="en">
<head>
<title>Duty check-in</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
</head>
<body>
<main class="page page--bare page--narrow">
  <p class="helper" id="who">SK Duty</p>
  <h1 class="h1">Duty check-in</h1>
  <div id="consent" class="cds--tile stack" hidden>
    <h2 class="h3">Location notice</h2>
    <p class="body" id="consentText"></p>
    <div id="acceptSlot"></div>
  </div>
  <div id="duties" class="stack"></div>
  <div id="action" class="stack" style="margin-top:1.5rem" hidden>
    <div id="checkinSlot"></div>
    <p class="helper" id="hint"></p>
  </div>
  <div id="msg" style="margin-top:1rem"></div>
  <div id="refreshSlot"></div>
</main>
<script type="module">
import { button, el, tag } from "/admin-common.js";
import { $, api, hhmm, initLiff, show } from "./liff.js";

const REASONS = {
  too_early: ["Not open yet", "Check-in for this duty has not opened."],
  too_late: ["Closed", "The check-in window for this duty has closed."],
  nonce_used: ["Try again", "This attempt was already used."],
  nonce_expired: ["Try again", "The page was open too long."],
  bad_nonce: ["Try again", ""],
  not_your_duty: ["Not your duty", "This duty is not assigned to you."],
  duty_cancelled: ["Cancelled", "This duty was cancelled."],
  rate_limited: ["Too many attempts", "Wait a few minutes."],
  no_consent: ["Notice not accepted", "Please accept the location notice first."],
  bad_coords: ["No usable location", "Your phone did not return a usable location."],
  line_unavailable: ["LINE unavailable", "Try again in a moment."],
};
let state = null, skew = 0, timer = null;
const checkin = button("Check in", { full: true });
$("checkinSlot").append(checkin);
$("acceptSlot").append(button("I understand, continue", { full: true, onclick: async () => { await api("/api/consent"); await load(); } }));

async function load() {
  const { status, data } = await api("/api/checkin/start");
  if (status === 403 && data.error === "not_linked") {
    show("msg", "warning", "Not linked yet", "Your LINE account is not linked to a staff member. Open the link page from the OA's welcome message.");
    return;
  }
  if (status !== 200) {
    const [t, s] = REASONS[data.error] ?? ["Error", data.error ?? String(status)];
    show("msg", "error", t, s);
    $("refreshSlot").replaceChildren(button("Refresh", { kind: "tertiary", full: true, onclick: () => location.reload() }));
    return;
  }
  state = data;
  skew = data.serverNow - Date.now();
  $("who").textContent = `${data.member.label} · ${data.member.staffCode}`;
  $("consent").hidden = !data.needsConsent;
  $("consentText").textContent = data.consentText;
  render();
}

function render() {
  $("duties").replaceChildren(...(state.duties.length ? state.duties.map((d) => el("div", { class: "cds--tile" },
    el("div", { class: "h3" }, `${d.shift} · ${hhmm(d.startAt)}–${hhmm(d.endAt)}`),
    el("p", { class: "body secondary" }, d.location),
    el("div", { style: "margin-top:.5rem" }, d.status === "CHECKED_IN"
      ? tag(`Checked in ${hhmm(d.checkedInAt)}${d.late ? " · late" : ""}`, d.late ? "magenta" : "green")
      : d.status === "MISSED" ? tag("Missed", "red")
      : tag(`Check-in ${hhmm(d.opensAt)}–${hhmm(d.closesAt)}`, "gray"))))
    : [el("p", { class: "body secondary" }, "No duty today.")]));
  const cur = state.current && state.duties.find((d) => d.id === state.current.dutyId);
  $("action").hidden = !cur || state.needsConsent;
  clearInterval(timer);
  if (!cur) return;
  const tick = () => {
    const now = Date.now() + skew;
    const open = now >= cur.opensAt && now <= cur.closesAt;
    checkin.disabled = !open;
    $("hint").textContent = open ? `${cur.shift} at ${cur.location}. Be on site, outdoors if you can.` : `Check-in opens at ${hhmm(cur.opensAt)}.`;
  };
  tick();
  timer = setInterval(tick, 5000);
}

const position = () => new Promise((resolve, reject) =>
  navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }));

checkin.addEventListener("click", async () => {
  checkin.disabled = true;
  show("msg", "info", "Getting your location…");
  let pos;
  try {
    pos = await position();
  } catch (e) {
    show("msg", "error", e.code === 1 ? "Location is off" : "No location",
      e.code === 1 ? "Allow location for LINE in your phone settings (and turn on Precise Location), then try again."
        : "Move outdoors or near a window and try again.");
    checkin.disabled = false;
    return;
  }
  show("msg", "info", "Checking…");
  const { coords } = pos;
  const { data } = await api("/api/checkin/submit", {
    dutyId: state.current.dutyId, nonce: state.current.nonce,
    lat: coords.latitude, lng: coords.longitude, accuracy: coords.accuracy, clientTs: Date.now(),
  });
  const r = data.result;
  await load(); // fresh nonce for the next try, fresh status
  if (r === "ok") show("msg", "success", data.reason === "already_checked_in" ? "Already checked in" : `Checked in${data.duty?.late ? " (late)" : ""}`);
  else if (r === "outside_geofence") show("msg", "error", "Too far from the duty point", `About ${Math.round(data.distanceM)} m away; allowed ${data.radiusM} m. Move closer and try again.`);
  else if (r === "low_accuracy") show("msg", "error", "Location not precise enough", `±${Math.round(coords.accuracy)} m; need ±${data.allowedAccuracyM} m. Go outdoors, turn on Precise Location, and try again.`);
  else { const [t, s] = REASONS[data.reason] ?? ["Not accepted", data.reason ?? r]; show("msg", "error", t, s); }
  if (r !== "ok") checkin.textContent = "Try again";
});

try {
  if (await initLiff()) await load();
} catch (e) {
  show("msg", "error", "Could not start", e.message);
}
</script>
</body>
</html>
