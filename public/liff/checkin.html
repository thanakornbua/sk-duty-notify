<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
</head>
<body>
<main class="page page--bare page--narrow" id="main">
  <img class="brand-hero" src="/brand/emblem-192.png" alt="" width="64" height="64">
  <p class="helper" id="who" data-i18n="app.name"></p>
  <h1 class="h1" data-i18n="liff.checkin.title"></h1>
  <div id="consent" class="cds--tile stack" hidden>
    <h2 class="h3" data-i18n="liff.consent.title"></h2>
    <p class="body" id="consentText"></p>
    <div id="acceptSlot"></div>
  </div>
  <div id="duties" class="stack"></div>
  <div id="action" class="stack" style="margin-top:1.5rem" hidden>
    <div id="checkinSlot"></div>
    <p class="helper" id="hint"></p>
  </div>
  <div id="msg" style="margin-top:1rem"></div>
  <div id="refreshSlot"></div>
</main>
<main class="page page--bare page--narrow" id="done" hidden></main>
<script type="module">
import { button, el, tag } from "/admin-common.js";
import { has, lang, t } from "/i18n.js";
import { $, api, hhmm, initLiff, setupPage, show } from "./liff.js";

setupPage();
document.title = t("liff.checkin.title");
const reason = (code) => (has(`lr.${code}.t`) ? [t(`lr.${code}.t`), t(`lr.${code}.b`)] : [t("liff.error"), String(code ?? "")]);
let state = null, skew = 0, timer = null;
const checkin = button(t("liff.checkIn"), { full: true });
$("checkinSlot").append(checkin);
$("acceptSlot").append(button(t("liff.consent.accept"), { full: true, onclick: async () => { await api("/api/consent"); await load(); } }));

async function load() {
  const { status, data } = await api("/api/checkin/start");
  if (status === 403 && data.error === "not_linked") { show("msg", "warning", t("liff.notLinked.title"), t("liff.notLinked.body")); return; }
  if (status !== 200) {
    const [a, b] = reason(data.error);
    show("msg", "error", a, b);
    $("refreshSlot").replaceChildren(button(t("liff.refresh"), { kind: "tertiary", full: true, onclick: () => location.reload() }));
    return;
  }
  state = data;
  skew = data.serverNow - Date.now();
  $("who").textContent = `${data.member.label} · ${data.member.staffCode}`;
  $("consent").hidden = !data.needsConsent;
  $("consentText").textContent = data.consentText[lang()] ?? data.consentText.en;
  render();
}

function render() {
  $("duties").replaceChildren(...(state.duties.length ? state.duties.map((d) => el("div", { class: "cds--tile" },
    el("div", { class: "h3" }, `${d.shift} · ${hhmm(d.startAt)}–${hhmm(d.endAt)}`),
    el("p", { class: "body secondary" }, d.location),
    el("div", { style: "margin-top:.5rem" }, d.status === "CHECKED_IN"
      ? tag(t("liff.checkedIn", { time: hhmm(d.checkedInAt) }) + (d.late ? ` · ${t("liff.late")}` : ""), d.late ? "magenta" : "green")
      : d.status === "MISSED" ? tag(t("liff.missed"), "red")
      : tag(t("liff.window", { from: hhmm(d.opensAt), to: hhmm(d.closesAt) }), "gray"))))
    : [el("p", { class: "body secondary" }, t("liff.noDuty"))]));
  const cur = state.current && state.duties.find((d) => d.id === state.current.dutyId);
  $("action").hidden = !cur || state.needsConsent;
  clearInterval(timer);
  if (!cur) return;
  const tick = () => {
    const now = Date.now() + skew;
    const open = now >= cur.opensAt && now <= cur.closesAt;
    checkin.disabled = !open;
    $("hint").textContent = open ? t("liff.onSite", { shift: cur.shift, location: cur.location }) : t("liff.opensAt", { time: hhmm(cur.opensAt) });
  };
  tick();
  timer = setInterval(tick, 5000);
}

/** Full-page "done" view after a successful (or already recorded) check-in. */
function done(res) {
  const d = res.duty;
  const ns = "http://www.w3.org/2000/svg";
  const icon = document.createElementNS(ns, "svg");
  icon.setAttribute("viewBox", "0 0 32 32"); icon.setAttribute("class", "done-icon"); icon.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(ns, "path"); // Carbon icon: checkmark--filled
  path.setAttribute("d", "M16,2A14,14,0,1,0,30,16,14,14,0,0,0,16,2ZM14,21.5908l-5-5L10.5906,15,14,18.4092,21.41,11l1.5957,1.5859Z");
  icon.append(path);
  const fact = (k, v) => [el("dt", { class: "body" }, t(k)), el("dd", { class: "body" }, v)];
  const already = res.reason === "already_checked_in";
  $("done").replaceChildren(
    icon,
    el("h1", { class: "h1", style: "margin-top:0" }, t("liff.done.title")),
    tag(t(d.late ? "liff.done.late" : "liff.done.onTime"), d.late ? "magenta" : "green"),
    el("dl", { class: "facts" },
      ...fact("liff.done.duty", `${d.shift} · ${hhmm(d.startAt)}–${hhmm(d.endAt)}`),
      ...fact("liff.done.location", d.location),
      ...fact("liff.done.time", `${hhmm(d.checkedInAt)}${lang() === "th" ? " น." : ""}`),
      ...(res.distanceM != null && !already ? fact("liff.done.distance", `${Math.round(res.distanceM)} ${lang() === "th" ? "ม." : "m"}`) : [])),
    el("div", { id: "doneMsg" }),
    el("div", { class: "stack", style: "margin-top:1.5rem" },
      button(t("liff.done.close"), { full: true, onclick: () => (liff.isInClient() ? liff.closeWindow() : window.close()) }),
      button(t("liff.done.duties"), { kind: "tertiary", full: true, onclick: () => { $("done").hidden = true; $("main").hidden = false; load(); } })));
  $("main").hidden = true;
  $("done").hidden = false;
  if (already) show("doneMsg", "info", t("liff.done.already"));
  else if (res.confirmQueued) show("doneMsg", "success", t("liff.done.message"));
  scrollTo(0, 0);
}

const position = () => new Promise((resolve, reject) =>
  navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }));

checkin.addEventListener("click", async () => {
  checkin.disabled = true;
  show("msg", "info", t("liff.locating"));
  let pos;
  try {
    pos = await position();
  } catch (e) {
    if (e.code === 1) show("msg", "error", t("liff.locOff.title"), t("liff.locOff.body"));
    else show("msg", "error", t("liff.noLoc.title"), t("liff.noLoc.body"));
    checkin.disabled = false;
    return;
  }
  show("msg", "info", t("liff.checking"));
  const { coords } = pos;
  const { data } = await api("/api/checkin/submit", {
    dutyId: state.current.dutyId, nonce: state.current.nonce,
    lat: coords.latitude, lng: coords.longitude, accuracy: coords.accuracy, clientTs: Date.now(),
  });
  if (data.result === "ok") { show("msg", null); done(data); return; }
  await load(); // fresh nonce for the next try, fresh status
  if (data.result === "outside_geofence") show("msg", "error", t("liff.far.title"), t("liff.far.body", { dist: Math.round(data.distanceM), radius: data.radiusM }));
  else if (data.result === "low_accuracy") show("msg", "error", t("liff.imprecise.title"), t("liff.imprecise.body", { acc: Math.round(coords.accuracy), need: data.allowedAccuracyM }));
  else { const [a, b] = reason(data.reason ?? data.error); show("msg", "error", a, b); }
  checkin.textContent = t("liff.tryAgain");
});

try {
  if (await initLiff()) await load();
} catch (e) {
  show("msg", "error", t("liff.couldNotStart"), e.message);
}
</script>
</body>
</html>
