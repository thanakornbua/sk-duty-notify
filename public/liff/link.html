<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/brand/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/logo-32.png">
<link rel="apple-touch-icon" href="/brand/logo-180.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
</head>
<body>
<main class="page page--bare page--narrow">
  <img class="brand-hero" src="/brand/emblem-192.png" alt="" width="64" height="64">
  <p class="helper" data-i18n="app.name"></p>
  <h1 class="h1" data-i18n="liff.link.title"></h1>
  <p id="intro" class="body secondary" data-i18n="liff.link.intro"></p>
  <div id="actions" class="stack" style="margin-top:1.5rem" hidden></div>
  <div id="msg" style="margin-top:1rem"></div>
</main>
<script type="module">
// Linking: LINE identity comes from the LIFF ID token (server-verified). Google sign-in proves which roster member
// this is. Google refuses sign-in inside in-app browsers, so that step opens the phone's normal browser.
import { button, el } from "/admin-common.js";
import { has, t } from "/i18n.js";
import { $, api, initLiff, setupPage, show } from "./liff.js";

setupPage();
document.title = t("liff.link.title");

const linked = (d) => {
  $("actions").hidden = true;
  $("intro").hidden = true;
  show("msg", "success", t("liff.link.done.title", { name: d.label }), t("liff.link.done.body", { code: d.staffCode }));
};
const fail = (code) => {
  const k = `ge.${code}`;
  show("msg", "error", has(`${k}.t`) ? t(`${k}.t`) : t("liff.error"), has(`${k}.b`) ? t(`${k}.b`) : String(code));
};

async function status() {
  const { status, data } = await api("/api/status");
  if (status !== 200) { fail(data.error ?? status); return null; }
  return data;
}

const go = button(t("liff.link.google"), { full: true, onclick: async () => {
  go.disabled = true;
  const { status, data } = await api("/api/google/link-start");
  go.disabled = false;
  if (status !== 200) { fail(data.error ?? status); return; }
  liff.openWindow({ url: data.url, external: true });
  check.hidden = false;
} });
const check = button(t("liff.link.check"), { kind: "tertiary", full: true, onclick: async () => {
  const d = await status();
  if (d?.linked) linked(d);
  else if (d) show("msg", "warning", t("liff.link.notYet.t"), t("liff.link.notYet.b"));
} });
check.hidden = true;
$("actions").append(go, el("p", { class: "helper" }, t("liff.link.external")), check);

try {
  if (await initLiff()) {
    const d = await status();
    if (d?.linked) linked(d);
    else if (d) $("actions").hidden = false;
  }
} catch (e) {
  show("msg", "error", t("liff.couldNotStart"), e.message);
}
// Coming back from the browser: re-check automatically.
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || check.hidden) return;
  const d = await status();
  if (d?.linked) linked(d);
});
</script>
</body>
</html>
