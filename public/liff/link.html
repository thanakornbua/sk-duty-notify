<!doctype html>
<html lang="th">
<head>
<title>SK Duty</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/png" href="/brand/emblem-32.png">
<link rel="apple-touch-icon" href="/brand/emblem-192.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
</head>
<body>
<main class="page page--bare page--narrow">
  <img class="brand-hero" src="/brand/emblem-192.png" alt="" width="64" height="64">
  <p class="helper" data-i18n="app.name"></p>
  <h1 class="h1" data-i18n="liff.link.title"></h1>
  <p class="body secondary" data-i18n="liff.link.intro"></p>
  <form id="form" class="stack" style="margin-top:1.5rem" novalidate></form>
  <div id="msg" style="margin-top:1rem"></div>
</main>
<script type="module">
import { button, textInput } from "/admin-common.js";
import { has, t } from "/i18n.js";
import { $, api, initLiff, setupPage, show } from "./liff.js";

setupPage();
document.title = t("liff.link.title");
const code = textInput({ id: "code", label: t("liff.link.code"), autocomplete: "one-time-code", autocapitalize: "characters", maxlength: 12, spellcheck: "false" });
code.input.classList.add("mono");
const go = button(t("liff.link.submit"), { type: "submit", full: true, disabled: true });
$("form").append(code, go);

try {
  if (await initLiff()) go.disabled = false;
} catch (e) {
  show("msg", "error", t("liff.couldNotStart"), e.message);
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  code.invalid(code.input.value.trim() ? null : t("liff.link.needCode"));
  if (!code.input.value.trim()) return;
  go.disabled = true;
  show("msg", "info", t("liff.link.linking"));
  const { status, data } = await api("/api/link", { code: code.input.value });
  if (status === 200) {
    $("form").hidden = true;
    show("msg", "success", t("liff.link.done.title", { name: data.label }), t("liff.link.done.body", { code: data.staffCode }));
  } else {
    const k = `lr.${data.error}`;
    if (has(`${k}.t`)) show("msg", "error", t(`${k}.t`), t(`${k}.b`));
    else show("msg", "error", t("liff.error"), String(data.error ?? status));
    go.disabled = false;
  }
});
</script>
</body>
</html>
