<!doctype html>
<html lang="en">
<head>
<title>Link account</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="icon" type="image/png" href="/brand/emblem-32.png">
<link rel="apple-touch-icon" href="/brand/emblem-192.png">
<link rel="stylesheet" href="/vendor/carbon-styles.min.css">
<link rel="stylesheet" href="/app.css">
<script src="https://static.line-scdn.net/liff/edge/versions/2.24.0/sdk.js"></script>
</head>
<body>
<main class="page page--bare page--narrow">
  <img class="brand-hero" src="/brand/emblem-192.png" alt="School emblem" width="64" height="64">
  <p class="helper">SK Duty</p>
  <h1 class="h1">Link your LINE account</h1>
  <p class="body secondary">Enter the one-time code from your duty coordinator. It works once and expires after 15 minutes.</p>
  <form id="form" class="stack" style="margin-top:1.5rem" novalidate></form>
  <div id="msg" style="margin-top:1rem"></div>
</main>
<script type="module">
import { button, textInput } from "/admin-common.js";
import { $, api, initLiff, show } from "./liff.js";

const MESSAGES = {
  bad_code: ["Code not valid", "It may have expired or been used already. Ask your coordinator for a new one."],
  line_account_linked_elsewhere: ["Already linked", "This LINE account is linked to another staff member. Contact your coordinator."],
  rate_limited: ["Too many tries", "Wait a minute and try again."],
  line_unavailable: ["LINE unavailable", "Try again in a moment."],
};
const code = textInput({ id: "code", label: "Code", autocomplete: "one-time-code", autocapitalize: "characters", maxlength: 12, spellcheck: "false" });
code.input.classList.add("mono");
const go = button("Link", { type: "submit", full: true, disabled: true });
$("form").append(code, go);

try {
  if (await initLiff()) go.disabled = false;
} catch (e) {
  show("msg", "error", "Could not start", e.message);
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  code.invalid(code.input.value.trim() ? null : "Enter the code.");
  if (!code.input.value.trim()) return;
  go.disabled = true;
  show("msg", "info", "Linking…");
  const { status, data } = await api("/api/link", { code: code.input.value });
  if (status === 200) {
    $("form").hidden = true;
    show("msg", "success", `Linked as ${data.label}`, `Staff code ${data.staffCode}. Duty notices will arrive in this chat.`);
  } else {
    const [t, s] = MESSAGES[data.error] ?? ["Could not link", data.error ?? String(status)];
    show("msg", "error", t, s);
    go.disabled = false;
  }
});
</script>
</body>
</html>
